name: tripgo
description: "TRIPGO - Your Journey. One Smart Ticket. Bus & Railway ticket reservation app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.0
  printing: ^5.13.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  path_provider: ^2.1.4
  share_plus: ^9.0.0
  connectivity_plus: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/